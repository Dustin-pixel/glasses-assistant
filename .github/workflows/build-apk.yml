name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - "cad/**"
      - ".github/workflows/render-cad.yml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk glasses-assistant-${{ github.run_number }}.apk

      # Easy phone download: Releases page on GitHub, newest at the top.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug build from ${{ github.sha }}. Download the .apk below and open it to install.
          files: glasses-assistant-${{ github.run_number }}.apk
